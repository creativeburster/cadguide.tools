[workspace]
resolver = "2"
members = [
    "crates/cad-math",
    "crates/cad-brep",
    "crates/cad-geometry2d",
    "crates/cad-dsl",
    "wasm-targets/wasm-parametric-cad",
    "wasm-targets/wasm-nesting-cam",
    "wasm-targets/wasm-code-cad",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/creativeburster/cadguide.tools"
authors = ["CADGuide.tools Open-Source Engineering Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1
strip = true
