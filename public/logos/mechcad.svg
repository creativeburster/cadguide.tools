<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mechcadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#mechcadGrad)" />
  <!-- 3D Parametric Mechanical Iso-Cube with hollow bore -->
  <!-- Top Face -->
  <polygon points="60,26 88,42 60,58 32,42" fill="url(#cubeTop)" stroke="#FFFFFF" stroke-width="2" />
  <!-- Left Face -->
  <polygon points="32,42 60,58 60,88 32,72" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2" />
  <!-- Right Face -->
  <polygon points="60,58 88,42 88,72 60,88" fill="url(#cubeRight)" stroke="#FFFFFF" stroke-width="2" />
  <!-- Internal Mechanical Bore Axis -->
  <ellipse cx="60" cy="42" rx="10" ry="5" fill="#075985" stroke="#BAE6FD" stroke-width="1.5" />
  <!-- Text Label -->
  <text x="60" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MECHCAD</text>
</svg>
